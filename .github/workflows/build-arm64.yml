name: Build sub2api arm64 image

# 从 DeanZFC/sub2api-custom 拉取源码，在 GitHub 的 arm64 runner 上原生编译，
# 产出的镜像推到本仓库所属账号的 GHCR。服务器只需 docker pull，无需本地编译。
#
# 用法：Actions → Build sub2api arm64 image → Run workflow
#   source_ref : 上游分支 / tag / commit sha，默认 sub2api-custom
#   version    : 镜像标签，留空则自动读取仓库里的 FORK_VERSION 文件

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'DeanZFC/sub2api-custom 的 ref（分支 / tag / sha）'
        required: true
        default: 'sub2api-custom'
      version:
        description: '镜像版本标签（留空则自动读 FORK_VERSION）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 拉取上游源码
        uses: actions/checkout@v4
        with:
          repository: DeanZFC/sub2api-custom
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: 解析版本号与提交
        id: meta
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then
            VER=$(tr -d '\r\n' < FORK_VERSION | sed 's/^v//')
          fi
          if [ -z "$VER" ]; then
            echo "无法确定版本号，请手动指定 version" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "提交: $SHA"
          echo "版本: $VER"

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 arm64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sub2api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/sub2api:latest
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/DeanZFC/sub2api-custom
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.sha }}
            BUILD_TYPE=source
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 汇总
        run: |
          {
            echo "## 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 上游提交 | \`${{ steps.meta.outputs.sha }}\` |"
            echo "| 版本 | \`${{ steps.meta.outputs.version }}\` |"
            echo "| 镜像 | \`ghcr.io/${{ github.repository_owner }}/sub2api:${{ steps.meta.outputs.version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
